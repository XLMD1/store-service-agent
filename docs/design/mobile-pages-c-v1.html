<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 方向手机核心页面图册</title><style>body{margin:0;background:#f7f9f8;color:#17313b;font-family:system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1500px;margin:auto;padding:24px}header{background:#17313b;color:white;max-width:none}header>div{max-width:1500px;margin:auto}h1{font-size:26px}p{line-height:1.6}header a{color:#b8e5de}h2{margin-top:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;align-items:start}figure{margin:0;max-width:390px}figure img{width:100%;height:auto;display:block;border:1px solid #dce4e3}figcaption{margin-bottom:12px;min-height:90px}h3{font-size:18px;margin:0 0 6px}figcaption p{font-size:14px;margin:0;color:#52646f}a:focus-visible{outline:3px solid #92400e;outline-offset:4px}</style><header><div><h1>C 方向 · 手机核心页面图册</h1><p>7 个核心页 · 概念效果图 · 示例数据 · 点击页面查看原图</p><p><a href="mobile-pages-c-v1.md">页面说明</a> · <a href="interface-brief-v1.0.md">界面简报</a> · <a href="mobile-pages-c-prompts-v1.md">复现提示词</a></p></div></header><main><h2>售后与维修</h2><div class="grid"><figure><figcaption><h3>1. 售后草稿核对</h3><p>对照纸本原件，核对模糊手机号；未核对时确认归档不可用。</p></figcaption><a href="assets/mobile-c/01-service-draft.png"><img src="assets/mobile-c/01-service-draft.png" alt="售后草稿核对" loading="lazy"></a></figure><figure><figcaption><h3>2. 售后检索与候选选择</h3><p>同一手机号匹配两个地址，逐个展示候选，由接单人选择。</p></figcaption><a href="assets/mobile-c/02-service-search.png"><img src="assets/mobile-c/02-service-search.png" alt="售后检索与候选选择" loading="lazy"></a></figure><figure><figcaption><h3>3. 售后档案详情</h3><p>呈现历史记录、待补充结果、对应原件与修订入口。</p></figcaption><a href="assets/mobile-c/03-service-detail.png"><img src="assets/mobile-c/03-service-detail.png" alt="售后档案详情" loading="lazy"></a></figure><figure><figcaption><h3>4. 维修辅助</h3><p>建议旁附依据，保留检查前提、资料缺口和追问入口。</p></figcaption><a href="assets/mobile-c/04-repair-assistant.png"><img src="assets/mobile-c/04-repair-assistant.png" alt="维修辅助" loading="lazy"></a></figure></div><h2>库存与登记</h2><div class="grid"><figure><figcaption><h3>5. 库存总览</h3><p>按库房和型号展示在库、预留、可售及筛选合计。</p></figcaption><a href="assets/mobile-c/05-inventory.png"><img src="assets/mobile-c/05-inventory.png" alt="库存总览" loading="lazy"></a></figure><figure><figcaption><h3>6. 预留提货确认</h3><p>确认前预览数量影响：在库和预留各减 2，可售保持 7。</p></figcaption><a href="assets/mobile-c/06-reserved-pickup.png"><img src="assets/mobile-c/06-reserved-pickup.png" alt="预留提货确认" loading="lazy"></a></figure><figure><figcaption><h3>7. 进货统计</h3><p>按日期统计有效进货，明确建账起点和统计范围。</p></figcaption><a href="assets/mobile-c/07-inbound-statistics.png"><img src="assets/mobile-c/07-inbound-statistics.png" alt="进货统计" loading="lazy"></a></figure></div><p>整理日期：2026-10-28。图中样例日期保留为 2026-10-26。此图册展示静态概念图片，业务操作尚未实现。</p></main></html>
